name: raqq
description: "التطبيق الراقي العراقي - رقى وأذكار وكتب واحجز الرقية مباشرة"
publish_to: 'none'
version: 1.0.0+2002

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  #状态 محلي للمطور/المستخدم وكلمة مرور المطور
  shared_preferences: ^2.3.3

  # قاعدة بيانات محلية للكتب (بدون.Firebase)
  sqflite: ^2.4.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # اتصالات وفتح روابط مواقع التواصل
  url_launcher: ^6.3.1

  # تشغيل الروابط المسموعة
  audioplayers: ^6.1.0

  # عرض ملفات PDF المحلية
  flutter_pdfview: ^1.4.1

  # اختيار صورة غلاف الكتاب من المعرض (للمطور فقط)
  image_picker: ^1.1.2

  # خط عربي RTL
  google_fonts: ^6.2.1
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/icon/adaptive/
    - assets/pdf/adhkar/
    - assets/pdf/ruqyah/
    - assets/pdf/ruqyah_ayat/
    - assets/pdf/about/
    - assets/pdf/books/
    - assets/pdf/roq/
    - assets/ruqyah/
    - assets/roq_text/
    - assets/book_covers/
    - assets/fonts/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic

flutter_native_splash:
  color: "#0B5345"
  image: assets/icon/logo_1024.png
  android: true
  ios: false
  android_12:
    image: assets/icon/logo_1024.png
    color: "#0B5345"
    icon_background_color: "#0B5345"

flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: "assets/icon/logo_1024.png"
  adaptive_icon_background: "assets/icon/adaptive/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive/ic_launcher_foreground.png"
